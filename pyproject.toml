[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cctr-video-retrieval"
version = "0.1.0"
description = "Calibration-Controlled Temporal Residual Transfer for frozen video-text retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "open_clip_torch==3.3.0",
  "Pillow>=10",
  "torch>=2.5",
  "torchvision>=0.20",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
